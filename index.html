<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Salon Trường</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loginView" class="center-shell">
    <div class="login-card">
      <div class="brand-mark">T</div>
      <h1>CRM SALON TRƯỜNG</h1>
      <p>23/25 Triệu Việt Vương, Hà Nội</p>
      <label>Tài khoản</label>
      <input id="loginUser" placeholder="admin / manager / stylist1 / reception" />
      <label>Mật khẩu</label>
      <input id="loginPass" type="password" placeholder="123456" />
      <button id="loginBtn" class="primary">Đăng nhập</button>
      <button id="registerBtn" class="secondary" style="width:100%;margin-top:10px">Đăng ký tài khoản nhân viên</button>
      <div id="authMessage" class="auth-message"></div>
      <div class="demo-box">
        <strong>Tài khoản demo</strong>
        <span>admin / 123456</span>
        <span>manager / 123456</span>
        <span>stylist1 / 123456</span>
        <span>reception / 123456</span>
      </div>
    </div>
  </div>

  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand-mark small">T</div>
        <div><strong>Salon Trường</strong><span>CRM</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <div id="currentUserBox"></div>
        <button id="logoutBtn" class="ghost">Đăng xuất</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle">Tổng quan vận hành salon</p>
        </div>
        <div class="top-actions">
          <button id="quickCustomerBtn" class="secondary">+ Khách hàng</button>
          <button id="quickBookingBtn" class="primary">+ Lịch hẹn</button>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitle">Thêm mới</h3>
        <button id="closeModal" class="icon-btn">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
